<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cámara · MediaPipe</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  /* Se muestra como un espejo para que resulte natural */
  video { width:100%; height:100%; object-fit:contain; transform:scaleX(-1); }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>

<script type="module">
/*  Versión básica: esta página solo muestra la cámara y envía a C# los 21 puntos
    de la mano de cada fotograma. El dibujo y las coordenadas los hace C#.
    Necesita internet para descargar MediaPipe y el modelo. */

const CDN   = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const post   = o => window.chrome?.webview?.postMessage(o);   // JavaScript → C#
const estado = t => post({ type: "status", text: t });

try {
  estado("Cargando MediaPipe…");
  const { HandLandmarker, FilesetResolver } = await import(`${CDN}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${CDN}/wasm`);

  const crear = delegate => HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: "VIDEO",
    numHands: 1,
  });

  let landmarker;
  try { landmarker = await crear("GPU"); }
  catch { landmarker = await crear("CPU"); }

  estado("Solicitando cámara…");
  const v = document.getElementById("v");
  v.srcObject = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: "user" }, audio: false
  });
  await v.play();
  estado("Cámara activa");

  let ultimo = -1;
  function bucle() {
    // Solo se analiza un fotograma si es nuevo
    if (v.currentTime !== ultimo && v.readyState >= 2) {
      ultimo = v.currentTime;
      const res = landmarker.detectForVideo(v, performance.now());

      if (res.landmarks.length) {
        const pts = [];
        for (const p of res.landmarks[0]) pts.push(p.x, p.y, p.z);   // 21 puntos → 63 números
        post({ type: "landmarks", w: v.videoWidth, h: v.videoHeight, pts });
      } else {
        post({ type: "nohand" });
      }
    }
    requestAnimationFrame(bucle);
  }
  requestAnimationFrame(bucle);

} catch (e) {
  post({ type: "error", text: String(e.message || e) });
}
</script>
</body>
</html>
